name: Windows build and offline checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure MSVC x64
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Release --parallel 4
      - name: Offline tests only
        run: ctest --test-dir build/ci -C Release --output-on-failure --output-junit results.xml
      - name: Check standalone diagnostics
        shell: pwsh
        run: |
          & ./build/ci/bin/Release/headset-desk-diagnostics.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help failed' }
          & ./build/ci/bin/Release/headset-desk-diagnostics.exe --simulate xm5
          if ($LASTEXITCODE -ne 0) { throw 'XM5 simulation failed' }
          & ./build/ci/bin/Release/headset-desk-diagnostics.exe --simulate ch720n
          if ($LASTEXITCODE -ne 0) { throw 'CH720N simulation failed' }
      - name: Upload diagnostic build and test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-diagnostic-build
          path: |
            build/ci/bin/Release/headset-desk-diagnostics.exe
            build/ci/results.xml
            LICENSE
            vendor/sony-device-center/LICENSE
          if-no-files-found: error
